[package]
name = "fintrack-server"
description = "FinTrack web server: multi-user, multi-household finance tracker for your home network"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "fintrack_server"
path = "src/lib.rs"

[[bin]]
name = "fintrack-server"
path = "src/main.rs"

[dependencies]
fintrack-core = { path = "../core" }
anyhow.workspace = true
chrono.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
argon2 = "0.5"
axum = { version = "0.8", features = ["multipart"] }
axum-extra = { version = "0.10", features = ["form", "query"] }
csv = "1.3"
maud = "0.27"
percent-encoding = "2"
rand = "0.8"
serde_html_form = "0.2"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["compression-gzip", "normalize-path", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile.workspace = true
