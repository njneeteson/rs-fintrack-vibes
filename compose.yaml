# FinTrack on your home server.
#
#   docker compose up -d --build
#   docker compose logs fintrack     # shows the one-time setup link on first start
#
# FinTrack serves plain HTTP on port 8080. Put your reverse proxy (Caddy,
# nginx, Traefik…) in front of it for HTTPS; examples are in docker/.

services:
  fintrack:
    build: .
    image: fintrack:latest
    restart: unless-stopped
    environment:
      # The URL prefix the proxy forwards to FinTrack (without stripping it).
      FINTRACK_BASE_PATH: /finances
      # Dates such as "this month" follow this time zone.
      TZ: America/Vancouver
      # Sessions with "keep me signed in" last this many days.
      FINTRACK_SESSION_DAYS: "30"
      # Cookies are HTTPS-only. Set to "false" only if you really serve FinTrack
      # over plain HTTP (passwords then cross your network unencrypted).
      FINTRACK_SECURE_COOKIES: "true"
      # Optional: create the first admin automatically instead of using the
      # setup link. Remove both lines after the first start.
      # FINTRACK_ADMIN_USER: alice
      # FINTRACK_ADMIN_PASSWORD: change-me-please
    volumes:
      - fintrack-data:/data
      # Or keep the data in a folder next to this file. The folder must be
      # writable by uid 65532 (sudo chown 65532:65532 ./data):
      # - ./data:/data
    ports:
      # Only the reverse proxy on this machine needs to reach FinTrack.
      # If the proxy runs in Docker on the same network, remove this and use
      # http://fintrack:8080 as its upstream.
      - "127.0.0.1:8080:8080"

volumes:
  fintrack-data:
