[workspace]
resolver = "3"
members = ["crates/core", "crates/server"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Nathan J Neeteson"]

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.37", features = ["bundled", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
strip = true
