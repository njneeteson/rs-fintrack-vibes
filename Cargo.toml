[package]
name = "rs-fintrack-vibes"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Offline household finance tracker: CSV import, categorization, analytics, budgets and mortgage projections"

[lib]
name = "fintrack"
path = "src/lib.rs"

[[bin]]
name = "fintrack"
path = "src/main.rs"

[dependencies]
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "=0.31.1"
egui_extras = { version = "=0.31.1", default-features = false, features = ["datepicker", "serde"] }
egui_plot = "=0.31.0"
rusqlite = { version = "0.37", features = ["bundled", "chrono"] }
csv = "1.3"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
directories = "6"
regex = "1"
anyhow = "1"

[dev-dependencies]
tempfile = "3"

[profile.dev.package."*"]
opt-level = 2
